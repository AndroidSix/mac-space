[package]
name = "system-balance"
version = "0.4.0"
edition = "2024"
description = "A local-first disk, workload and power manager"

[lib]
name = "system_balance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "disk", "component", "user"] }
libc = "0.2"
notify = "8"
axum = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
getrandom = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8

[profile.dev]
debug = 0

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

