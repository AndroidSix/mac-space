[package]
name = "mac-space"
version = "0.3.0"
edition = "2024"
description = "A local-first macOS disk and workload manager"

[lib]
name = "mac_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "disk", "component", "user"] }
libc = "0.2"
notify = "8"
axum = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8

[profile.dev]
debug = 0
