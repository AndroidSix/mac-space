name: Windows
on:
  push:
    branches: [main, feat/system-balance]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ always() }}
      - run: npm ci
      - run: npm test
      - run: npm run test:native -- --release
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --release --all-targets -- -D warnings
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: SystemBalance-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
